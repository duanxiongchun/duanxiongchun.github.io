<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家长控制基地 - Parent Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lab.css">
  <style>
    .parent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-top: 20px;
    }
    
    .stats-card {
      display: flex;
      justify-content: space-around;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-val {
      font-size: 1.8em;
      font-weight: 800;
      color: var(--color-accent);
      font-family: var(--font-fira);
    }
    
    .redemp-card {
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    @media (max-width: 768px) {
      .parent-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body style="background: #090a10;">
  
  <!-- Parent Arithmetic Gate -->
  <div id="parent-lock" class="gate-overlay" style="display: flex;">
    <div class="glass-card gate-container text-center">
      <h2 style="color: var(--color-accent); font-weight: 800; margin-bottom: 10px;">🔒 家长验证控制台</h2>
      <p style="color:#94a3b8; font-size: 0.9em; margin-bottom: 25px;">请正确解答以下口算题以启动控制舱（防止果果误入修改积分）：</p>
      <h1 id="lock-expression" style="color: #6366f1; font-size: 3em; margin-bottom: 20px; font-family: var(--font-fira);">7 * 8 = ?</h1>
      <input type="number" id="lock-answer" class="mock-input" style="width:140px; text-align:center; font-size:1.6em; border-color: rgba(99,102,241,0.5);" placeholder="??">
      <button class="mock-button glow-dabao" onclick="verifyParentLock()" style="margin-top:20px; display:block; width:100%; font-size:1.1em; padding:12px;">启动系统</button>
      <button onclick="window.location.href='index.html'" style="background:transparent; border:none; color:#64748b; margin-top:20px; cursor:pointer; font-size:0.9em;">🛸 返回乘员舱入口</button>
    </div>
  </div>

  <!-- Main Parent Management Dashboard -->
  <div id="parent-dashboard" style="display: none; max-width: 1200px; margin: 0 auto; padding: 20px 20px 40px;">
    
    <header class="hud-nav glass-card" style="margin-bottom: 20px; border-color: rgba(6, 182, 212, 0.3);">
      <div class="nav-left">
        <span style="font-size: 2.2em;">⚙️</span>
        <div>
          <h2 style="font-weight: 800; color: #06b6d4;">家长控制基地 Parent Cockpit</h2>
          <p style="font-size: 0.8em; color: var(--text-muted);">大连线管理、日常星星与设备进度同步中心</p>
        </div>
      </div>
      <button class="back-gate-btn" onclick="window.location.href='index.html'" style="background: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.2); color: #22d3ee;">🛸 返回主入口</button>
    </header>
    
    <!-- Stats Row -->
    <div class="glass-card stats-card">
      <div class="stat-item">
        <p style="font-size:0.8em; color:#94a3b8;">🦁 果果星星余额</p>
        <div id="stat-dabao-stars" class="stat-val" style="color:#818cf8;">0</div>
      </div>
      <div class="stat-item" style="border-left: 1px solid rgba(255,255,255,0.08); border-right: 1px solid rgba(255,255,255,0.08); padding: 0 40px;">
        <p style="font-size:0.8em; color:#94a3b8;">🐰 淼淼星星余额</p>
        <div id="stat-erbao-stars" class="stat-val" style="color:#fbbf24;">0</div>
      </div>
      <div class="stat-item">
        <p style="font-size:0.8em; color:#94a3b8;">📋 待处理兑换申请</p>
        <div id="stat-pending-redemps" class="stat-val" style="color:#f43f5e;">0</div>
      </div>
    </div>

    <div class="parent-grid">
      <!-- Star Coins & Rewards panel -->
      <div class="glass-card" style="padding: 25px; border-color: rgba(99, 102, 241, 0.25);">
        <h3 style="color:#818cf8; margin-bottom: 15px; font-weight: 700;">🎁 待发放奖励申请</h3>
        <div id="redemption-list" style="max-height: 400px; overflow-y: auto;">
          <!-- approvals dynamically loaded -->
        </div>
      </div>
      
      <!-- Synchronization panel -->
      <div class="glass-card" style="padding: 25px; border-color: rgba(245, 158, 11, 0.25);">
        <h3 style="color:#fbbf24; margin-bottom: 5px; font-weight: 700;">💾 备份学习轨迹 & 设备同步</h3>
        <p style="font-size:0.8em; color:#94a3b8; margin-bottom: 20px;">轻松在 iPad 平板、手机和电脑等不同设备间同步两个宝宝的学习进度：</p>
        
        <button class="mock-button glow-erbao" onclick="exportDataJSON()" style="margin-bottom:12px; width:100%; display:block; text-align:left; font-size:0.95em;">💾 1. 下载本地备份文件 (.json)</button>
        <button class="mock-button glow-dabao" onclick="exportDataClipboard()" style="margin-bottom:20px; width:100%; display:block; text-align:left; font-size:0.95em;">📋 2. 复制长文本口令到微信/备忘录</button>
        
        <h4 style="margin-top:25px; border-top:1px dashed rgba(255,255,255,0.08); padding-top:20px; color:#f8fafc; font-weight:600;">📥 从其他设备导入/恢复进度</h4>
        <p style="font-size:0.75em; color:#94a3b8; margin-top:5px; margin-bottom:10px;">粘贴您在另一台设备上复制的备份口令，一键恢复最新的打卡进度：</p>
        <textarea id="import-token" class="mock-input" style="width:100%; height:80px; font-size:0.85em; font-family:var(--font-fira); line-height:1.4;" placeholder="在这里粘贴微信转发的备份口令..."></textarea>
        <button class="mock-button glow-success" onclick="importDataToken()" style="margin-top:10px; width:100%; font-size:0.95em; padding:8px;">📥 一键导入并覆盖数据</button>
        
        <!-- CLEAR HISTORY TRIGGER -->
        <button class="mock-button" onclick="clearAllHistory()" style="margin-top:35px; width:100%; background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.4); color:#fca5a5; font-weight:700; border-style:dashed;">⚠️ 一键清空所有历史记录 (重置进度)</button>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script>
    let currentAnswer = 56;
    
    function generateQuestion() {
      const a = Math.floor(Math.random() * 8) + 3; // 3 to 10
      const b = Math.floor(Math.random() * 8) + 3;
      currentAnswer = a * b;
      document.getElementById("lock-expression").innerText = `${a} * ${b} = ?`;
    }
    
    function verifyParentLock() {
      const val = parseInt(document.getElementById("lock-answer").value);
      if (val === currentAnswer) {
        document.getElementById("parent-lock").style.display = "none";
        document.getElementById("parent-dashboard").style.display = "block";
        loadDashboardStats();
      } else {
        alert("❌ 口算验证未通过，请家长再试一次！");
        document.getElementById("lock-answer").value = "";
        generateQuestion();
      }
    }

    function loadDashboardStats() {
      initAppState();
      document.getElementById("stat-dabao-stars").innerText = appState.players.dabao.stars;
      document.getElementById("stat-erbao-stars").innerText = appState.players.erbao.stars;
      document.getElementById("stat-pending-redemps").innerText = appState.redemptions.length;
      loadRedemptions();
    }

    function loadRedemptions() {
      const container = document.getElementById("redemption-list");
      if (appState.redemptions.length === 0) {
        container.innerHTML = `<p style="color:#64748b; text-align:center; padding:30px;">暂无小朋友提交的奖品兑换申请。</p>`;
        return;
      }
      
      container.innerHTML = appState.redemptions.map((redemp, i) => `
        <div class="glass-card redemp-card">
          <div>
            <div style="font-weight:700; font-size:1em; color:#fff;">
              ${redemp.playerId === 'dabao' ? '🦁' : '🐰'} ${redemp.playerName}
            </div>
            <div style="font-size:0.85em; color:var(--text-muted); margin-top:2px;">
              申请兑换: <span style="color:#fbbf24; font-weight:600;">${redemp.rewardTitle}</span>
            </div>
            <div style="font-size:0.75em; color:#64748b; margin-top:2px;">
              时间: ${redemp.date} · 需扣减 🪙 ${redemp.cost} 星星
            </div>
          </div>
          <button class="mock-button glow-success" onclick="approveRedemption(${i})" style="padding:6px 12px; font-size:0.8em; border-radius:6px;">确认发放</button>
        </div>
      `).join("");
    }

    function approveRedemption(index) {
      initAppState();
      const redemp = appState.redemptions[index];
      const player = appState.players[redemp.playerId];
      
      if (player.stars >= redemp.cost) {
        player.stars -= redemp.cost;
        appState.redemptions.splice(index, 1);
        saveAppState();
        alert(`🎉 发放确认！成功从 ${player.name} 余额中扣除 ${redemp.cost} 星星。请在现实中为孩子兑现「${redemp.rewardTitle}」吧！`);
        loadDashboardStats();
      } else {
        alert("❌ 孩子账户中的星星不足以完成兑换！（可能被手动清零了）");
      }
    }

    function exportDataJSON() {
      initAppState();
      const str = JSON.stringify(appState, null, 2);
      const blob = new Blob([str], {type: "application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `kids-logic-lab-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function exportDataClipboard() {
      initAppState();
      // btoa base64 safely encoding unicode characters
      const str = btoa(unescape(encodeURIComponent(JSON.stringify(appState))));
      navigator.clipboard.writeText(str).then(() => {
        alert("🎉 备份数据长口令已成功复制到您的剪贴板！\n您可以直接在微信聊天框中长按粘贴，并发送到您的其他手机或iPad设备中导入！");
      }).catch(err => {
        alert("复制口令失败，请手动在浏览器地址栏检查相关权限设置。");
      });
    }

    function importDataToken() {
      const code = document.getElementById("import-token").value.trim();
      if (!code) return alert("❌ 请输入备份口令码！");
      
      try {
        const decoded = decodeURIComponent(escape(atob(code)));
        const parsed = JSON.parse(decoded);
        
        if (parsed.players && parsed.players.dabao && parsed.players.erbao && parsed.rewards) {
          if (confirm("⚠️ 注意：导入备份将完全覆盖本设备上当前所有的进度和星星记录，是否继续？")) {
            appState = parsed;
            saveAppState();
            alert("🎉 数据同步成功！正在刷新页面加载最新进度...");
            window.location.reload();
          }
        } else {
          throw new Error("Invalid schema");
        }
      } catch (e) {
        alert("❌ 导入口令码解析失败！请检查复制的代码是否完整，确保没有多余的空格或字符丢失。");
      }
    }

    window.onload = () => {
      initAppState();
      generateQuestion();
    };
  </script>
</body>
</html>
